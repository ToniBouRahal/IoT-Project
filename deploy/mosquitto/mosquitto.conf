# Eclipse Mosquitto configuration for Safety System

# Disable anonymous access
allow_anonymous false

# Password file (generated with mosquitto_passwd)
password_file /mosquitto/config/passwd

# ACL file
acl_file /mosquitto/config/acl.conf

# Internal (Docker-only) plain MQTT listener — used by backend container
listener 1883 0.0.0.0
protocol mqtt

# TLS listener — exposed to internet for Raspberry Pi
listener 8883 0.0.0.0
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false
tls_version tlsv1.2

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
