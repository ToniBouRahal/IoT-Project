# Eclipse Mosquitto configuration for Safety System

# Disable anonymous access
allow_anonymous false

# Password file (generated with mosquitto_passwd)
password_file /mosquitto/config/passwd

# ACL file
acl_file /mosquitto/config/acl.conf

# Plain MQTT — used by both the backend container (internal)
# and the Raspberry Pi (external via Traefik TLS termination on port 8883)
listener 1883 0.0.0.0
protocol mqtt

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
