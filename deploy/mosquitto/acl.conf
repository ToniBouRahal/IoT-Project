# Backend user — full access to all safety topics
user backend
topic readwrite safety/#

# Device users — scoped to their own device_id
# Pattern: device username must match the {device_id} segment of the topic.
# Mosquitto pattern ACLs: %u = username, %c = client_id

# Devices can publish telemetry, events, state, heartbeat
user raspi3-grovepi-01
topic write safety/raspi3-grovepi-01/telemetry
topic write safety/raspi3-grovepi-01/event
topic write safety/raspi3-grovepi-01/state
topic write safety/raspi3-grovepi-01/heartbeat

# Devices can subscribe to their own command topic
user raspi3-grovepi-01
topic read safety/raspi3-grovepi-01/command
